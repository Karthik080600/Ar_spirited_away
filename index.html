<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1522">
<title>Spirited Away · AR Poster</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
  "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
} }
</script>
</head>
<body>
  <div id="stage"></div>

  <section id="start" class="screen">
    <div class="card">
      <p class="eyebrow">Studio Ghibli · AR experience</p>
      <h1>千と千尋の神隠し</h1>
      <p class="lede">Point your camera at the poster. Then step inside — look around to explore the world beyond the frame, and tap a character to hear them.</p>
      <button id="btnStart" class="primary">Start AR</button>
      <button id="btnPreview" class="link">Preview without camera</button>
    </div>
  </section>

  <section id="loading" class="screen hidden"><div class="spinner"></div><p id="loadMsg">Loading…</p></section>

  <div id="hint" class="pill hidden"></div>
  <div id="toast" class="pill toast hidden"></div>
  <div id="caption" class="caption hidden"><b id="capName"></b><span id="capLine"></span></div>
  <button id="btnMute" class="icon hidden" aria-label="Sound on/off">♪</button>

  <section id="error" class="screen hidden"><div class="card"><p id="errMsg"></p><button class="primary" onclick="location.reload()">Try again</button></div></section>

  <script type="module" src="app.js"></script>
</body>
</html>
